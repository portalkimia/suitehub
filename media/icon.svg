<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="liquidGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Orbital Rings -->
  <ellipse cx="256" cy="256" rx="180" ry="65" fill="none" stroke="#7c3aed" stroke-width="6" opacity="0.4" transform="rotate(-30 256 256)"/>
  <ellipse cx="256" cy="256" rx="180" ry="65" fill="none" stroke="#059669" stroke-width="6" opacity="0.4" transform="rotate(30 256 256)"/>
  <circle cx="120" cy="180" r="10" fill="#a78bfa" filter="url(#glow)"/>
  <circle cx="392" cy="332" r="10" fill="#34d399" filter="url(#glow)"/>
  <!-- Central Erlenmeyer Flask Icon -->
  <path d="M224 100 L288 100 L288 160 L370 330 C382 355 365 390 335 390 L177 390 C147 390 130 355 142 330 L224 160 Z" fill="none" stroke="url(#flaskGrad)" stroke-width="20" stroke-linejoin="round" stroke-linecap="round" filter="url(#glow)"/>
  <!-- Liquid Level -->
  <path d="M165 330 C200 315 230 345 270 330 C310 315 330 325 347 330 L335 375 C330 380 320 385 310 385 L202 385 C192 385 182 380 177 375 Z" fill="url(#liquidGrad)" opacity="0.85"/>
  <!-- Bubbles -->
  <circle cx="230" cy="300" r="12" fill="#ecfdf5" opacity="0.8"/>
  <circle cx="280" cy="280" r="8" fill="#ecfdf5" opacity="0.8"/>
  <circle cx="256" cy="240" r="10" fill="#a78bfa" opacity="0.9" filter="url(#glow)"/>
  <!-- Rim of Flask -->
  <line x1="210" y1="100" x2="302" y2="100" stroke="url(#flaskGrad)" stroke-width="20" stroke-linecap="round"/>
</svg>